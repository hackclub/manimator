# PostgreSQL. In production, DATABASE_URL points at the main database; the Solid Cache and Solid Queue databases
# default to the same server with _cache and _queue on the end of the name, or set CACHE_DATABASE_URL and
# QUEUE_DATABASE_URL to put them somewhere else.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: manimator_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: manimator_test

<%
  primary_url = ENV["DATABASE_URL"].to_s
  sibling_url = ->(suffix) { primary_url.sub(%r{/([^/?]+)(\?|\z)}) { "/#{$1}_#{suffix}#{$2}" } }
%>
production:
  primary:
    <<: *default
    url: <%= primary_url %>
  cache:
    <<: *default
    url: <%= ENV.fetch("CACHE_DATABASE_URL") { sibling_url.("cache") } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV.fetch("QUEUE_DATABASE_URL") { sibling_url.("queue") } %>
    migrations_paths: db/queue_migrate
